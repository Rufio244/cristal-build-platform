services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cristal
      POSTGRES_PASSWORD: cristal
      POSTGRES_DB: cristal_build
    ports: ["5432:5432"]
    volumes: [cristal-postgres:/var/lib/postgresql/data]
  server:
    build:
      context: ../server
      dockerfile: ../deployment/Dockerfile.server
    environment:
      DATABASE_URL: postgresql://cristal:cristal@postgres:5432/cristal_build?schema=public
      PORT: 5000
    ports: ["5000:5000"]
    depends_on: [postgres]
  client:
    build:
      context: ../client
      dockerfile: ../deployment/Dockerfile.client
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports: ["3000:3000"]
    depends_on: [server]
volumes:
  cristal-postgres:
